name: W11.4 Pilot Supabase Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-pilot:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy

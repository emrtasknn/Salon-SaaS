name: Temporary lockfile refresh

on:
  push:
    branches:
      - feature/issue-6-persistence-foundation

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-6-persistence-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh package lockfile"
          git push origin HEAD:feature/issue-6-persistence-foundation
